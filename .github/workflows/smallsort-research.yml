name: SmallSort research

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Research proof set to run
        type: choice
        default: insertion_all_4
        options:
          - sort4_contract_diagnostics
          - rapx_applicability
          - rapx_evidence_replay
          - select_intrinsic_evidence_replay
          - sort4_functional
          - insertion_all_4
          - insertion_contracts_4
          - insertion_direct_4
          - insertion_outer_invariant_4
          - insertion_ub_safety_4
          - verifast_insert_tail_probe
          - verifast_insert_tail_range
          - verifast_insert_tail_tuple_overlay
          - verifast_insert_tail_tuple_parser
          - verifast_insert_tail_fnmut_hrtb
          - verifast_insert_tail_lft_cut
          - verifast_insert_tail_address_taken
          - verifast_insert_tail_manually_drop_ref
          - verifast_copy_on_drop_gate
          - verifast_local_drop_caller_gate
          - verifast_borrow_recovery
          - verifast_sort4_components
          - verifast_maybeuninit_new_pointer
          - verifast_sort4_alignment
          - verifast_rust_fieldless_layout
          - verifast_borrow_recovery_manually_drop
          - verifast_swap_size
          - ub_detector_controls
          - ub_immutable_observation
          - all
          - orders_i32_pair
          - preserves_i32_values_for_any_decision
      budget_minutes:
        description: Total execution budget, including cold setup and build
        type: choice
        default: '90'
        options: ['30', '60', '90', '120']
      sort4_component:
        description: Isolated stock sort4 component
        type: choice
        default: index
        options: [index, order, select, range, swo, swo_network]
      forget_guard_stage:
        description: Forget diagnostics under the existing pointer selection
        type: choice
        default: drop_v4
        options: [drop_v4, forget_diagnostic, forget_generic]
      rapx_gate:
        description: Ordered RAPx applicability gate
        type: choice
        default: A
        options: [A]

permissions:
  contents: read

concurrency:
  group: smallsort-research-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    if: inputs.proof != 'rapx_evidence_replay' && inputs.proof != 'select_intrinsic_evidence_replay'
    name: Verify selected SmallSort research proofs
    permissions:
      contents: read
      actions: read
    runs-on: ${{ (inputs.proof == 'verifast_insert_tail_tuple_parser' || inputs.proof == 'verifast_insert_tail_fnmut_hrtb' || inputs.proof == 'verifast_insert_tail_lft_cut' || inputs.proof == 'verifast_insert_tail_address_taken' || inputs.proof == 'verifast_insert_tail_manually_drop_ref' || inputs.proof == 'verifast_copy_on_drop_gate' || inputs.proof == 'verifast_local_drop_caller_gate' || inputs.proof == 'verifast_borrow_recovery_manually_drop' || inputs.proof == 'verifast_rust_fieldless_layout' || inputs.proof == 'verifast_maybeuninit_new_pointer') && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (inputs.proof == 'verifast_maybeuninit_new_pointer' && inputs.forget_guard_stage == 'forget_generic') && 8 || (inputs.proof == 'verifast_maybeuninit_new_pointer' && inputs.forget_guard_stage == 'forget_diagnostic') && 18 || inputs.proof == 'verifast_maybeuninit_new_pointer' && 25 || inputs.proof == 'verifast_sort4_components' && 30 || (inputs.proof == 'verifast_sort4_alignment' || inputs.proof == 'verifast_rust_fieldless_layout') && fromJSON(inputs.budget_minutes) || inputs.proof == 'rapx_applicability' && 90 || 150 }}
    steps:
      - name: Check out the selected workflow branch
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Record hosted job start
        if: inputs.proof == 'rapx_applicability'
        run: echo "RAPX_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record independent alignment job start
        if: inputs.proof == 'verifast_sort4_alignment' || inputs.proof == 'verifast_rust_fieldless_layout'
        run: echo "H_ALIGN_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record source-linked constructor job start
        if: inputs.proof == 'verifast_maybeuninit_new_pointer'
        run: echo "SORT4_CONSTRUCTOR_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Record stock sort4 component job start
        if: inputs.proof == 'verifast_sort4_components'
        run: echo "SORT4_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Prepare runner
        env:
          PROOF_SELECTION: ${{ inputs.proof }}
        run: |
          # Kani needs space for its cold build; VeriFast only installs its pins.
          case "$PROOF_SELECTION" in
            verifast_*) ;;
            *) sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup ;;
          esac
          sudo apt-get update
          if [[ "$PROOF_SELECTION" == rapx_applicability ]]; then
            sudo apt-get install --yes jq ripgrep time libz3-dev libclang-dev pkg-config
          else
            sudo apt-get install --yes jq ripgrep time
          fi
          df -h

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: smallsort-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool_config/kani-version.toml') }}

      - name: Verify selected research proofs
        env:
          PROOF_SELECTION: ${{ inputs.proof }}
          RUN_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
          SORT4_COMPONENT: ${{ inputs.sort4_component }}
          FORGET_GUARD_STAGE: ${{ inputs.forget_guard_stage || 'drop_v4' }}
          GH_TOKEN: ${{ github.token }}
          RAPX_GATE: ${{ inputs.rapx_gate }}
        run: |
          case "$PROOF_SELECTION" in
            sort4_contract_diagnostics) bash research/challenge-8/run-sort4-contract.sh "$RUN_BUDGET_MINUTES" ;;
            rapx_applicability) bash research/challenge-8/run-rapx-applicability.sh "$RUN_BUDGET_MINUTES" "$RAPX_GATE" ;;
            sort4_functional) bash research/challenge-8/run-sort4.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_insert_tail_probe) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_insert_tail_range) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" range ;;
            verifast_insert_tail_tuple_overlay) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_overlay ;;
            verifast_insert_tail_tuple_parser) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_parser ;;
            verifast_insert_tail_fnmut_hrtb) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_hrtb ;;
            verifast_insert_tail_lft_cut) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_lft_cut ;;
            verifast_insert_tail_address_taken) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_address_taken ;;
            verifast_insert_tail_manually_drop_ref) bash research/challenge-8/run-verifast-probe.sh "$RUN_BUDGET_MINUTES" tuple_manually_drop_ref ;;
            verifast_copy_on_drop_gate) bash research/challenge-8/run-verifast-drop-gate.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_local_drop_caller_gate) bash research/challenge-8/run-verifast-drop-caller-gate.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_sort4_alignment) bash research/challenge-8/run-verifast-sort4-alignment.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_rust_fieldless_layout) bash research/challenge-8/run-rust-fieldless-layout.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_borrow_recovery) bash research/challenge-8/run-verifast-borrow-recovery.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_maybeuninit_new_pointer)
              if [[ "$FORGET_GUARD_STAGE" == forget_generic ]]; then
                bash research/challenge-8/run-select-forget-generic.sh "$RUN_BUDGET_MINUTES"
              elif [[ "$FORGET_GUARD_STAGE" == forget_diagnostic ]]; then
                bash research/challenge-8/run-select-forget-diagnostic.sh "$RUN_BUDGET_MINUTES"
              else
                [[ "$FORGET_GUARD_STAGE" == drop_v4 ]] || exit 2
                bash research/challenge-8/run-select-pointer.sh "$RUN_BUDGET_MINUTES"
              fi ;;
            verifast_sort4_components) bash research/challenge-8/run-verifast-sort4-components.sh "$RUN_BUDGET_MINUTES" "$SORT4_COMPONENT" ;;
            verifast_borrow_recovery_manually_drop) BORROW_RECOVERY_PROFILE=manually_drop_only bash research/challenge-8/run-verifast-borrow-recovery.sh "$RUN_BUDGET_MINUTES" ;;
            verifast_swap_size) bash research/challenge-8/run-verifast-swap-size.sh "$RUN_BUDGET_MINUTES" ;;
            ub_detector_controls) bash research/challenge-8/run-ub-controls.sh "$RUN_BUDGET_MINUTES" ;;
            ub_immutable_observation) bash research/challenge-8/run-ub-controls.sh "$RUN_BUDGET_MINUTES" immutable_observation ;;
            insertion_ub_safety_4) bash research/challenge-8/run-insertion-ub.sh "$RUN_BUDGET_MINUTES" ;;
            insertion_*) bash research/challenge-8/run-insertion.sh "$PROOF_SELECTION" "$RUN_BUDGET_MINUTES" ;;
            *) bash research/challenge-8/run-smoke.sh "$PROOF_SELECTION" "$RUN_BUDGET_MINUTES" ;;
          esac

      - name: Check compact evidence packager safety
        if: always() && inputs.proof == 'verifast_maybeuninit_new_pointer'
        id: compact_safety
        run: python3 research/challenge-8/test-package-sort4-evidence.py

      - name: Package current and O4 compact evidence archive
        if: always() && inputs.proof == 'verifast_maybeuninit_new_pointer' && steps.compact_safety.outcome == 'success'
        id: compact_package
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_SELECTION: ${{ inputs.proof }}
        run: python3 research/challenge-8/package-sort4-evidence.py --output-dir research-results/compact-evidence

      - name: Preserve current and O4 compact evidence archive
        if: always() && inputs.proof == 'verifast_maybeuninit_new_pointer' && steps.compact_package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: smallsort-select-compact-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-results/compact-evidence/sort4-select-compact-evidence.zip
          if-no-files-found: error
          retention-days: 90

      - name: Replay both saved H_align artifacts and test classification
        if: always() && inputs.proof == 'verifast_sort4_alignment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash research/challenge-8/run-sort4-alignment-replay.sh

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallsort-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research-results/
            !research-results/**/mutation-profile/**
          if-no-files-found: warn
          retention-days: 7

  rapx_evidence_replay:
    if: inputs.proof == 'rapx_evidence_replay'
    name: Replay saved RAPx gate A evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact processor revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and process the pinned saved artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_BUDGET_MINUTES: ${{ inputs.budget_minutes }}
        run: bash research/challenge-8/run-rapx-evidence-replay.sh "$REPLAY_BUDGET_MINUTES"
      - name: Preserve replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapx-evidence-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-results/rapx-evidence-replay/
          if-no-files-found: warn
          retention-days: 7

  select-intrinsic-replay:
    if: inputs.proof == 'select_intrinsic_evidence_replay'
    name: Replay saved pointer intrinsic evidence
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve pinned S5j compact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research-results/select-pointer/replay
          gh api repos/Tiramisu-Cake/verify-rust-std/actions/artifacts/11481774726/zip > "$RUNNER_TEMP/s5j-evidence.zip"
          printf '%s  %s\n' 1a5e4957da5db048d02cb56bc518eb8afa195be5384d60f300281ed8f0f036c7 "$RUNNER_TEMP/s5j-evidence.zip" | sha256sum -c -
          gh api repos/Tiramisu-Cake/verify-rust-std/actions/runs/37621751848 > research-results/select-pointer/replay/original-run.json
          gh api repos/Tiramisu-Cake/verify-rust-std/actions/artifacts/11481774726 > research-results/select-pointer/replay/original-artifact.json
      - name: Replay exact classifications and classifier regressions
        env:
          SORT4_SELECT_PROFILE: experimental-source-linked-select-pointer-intrinsics-v2
        run: |
          python3 research/challenge-8/test-select-pointer-intrinsics-classifier.py --evidence research-results/select-pointer/replay/classifier-self-check.json
          python3 research/challenge-8/replay-select-pointer-intrinsics.py --archive "$RUNNER_TEMP/s5j-evidence.zip" --evidence research-results/select-pointer/replay
      - name: Package compact replay evidence
        if: always()
        run: |
          python3 - <<'PY_REPLAY_ZIP'
          from pathlib import Path
          import zipfile
          root = Path('research-results/select-pointer/replay')
          target = root.parent / 'intrinsic-replay-evidence.zip'
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root))
          if target.stat().st_size > 25 * 1024 * 1024:
              raise SystemExit('replay archive exceeds 25 MiB')
          PY_REPLAY_ZIP
      - name: Preserve independent replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smallsort-intrinsic-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: research-results/select-pointer/intrinsic-replay-evidence.zip
          retention-days: 90
